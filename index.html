<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Chat Premium</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- PREMIUM CSS STYLES --- */
      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --glass-bg: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.2);
        --text-color: #333;
        --my-msg-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --other-msg-bg: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #1a1a2e;
        background-image: radial-gradient(
          circle at 10% 20%,
          rgb(90, 92, 106) 0%,
          rgb(32, 45, 58) 81.3%
        );
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* --- Login Screen --- */
      #login-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-box {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        animation: fadeIn 0.8s ease;
      }

      .login-box h2 {
        background: -webkit-linear-gradient(#667eea, #764ba2);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 25px;
        font-weight: 700;
      }

      .login-box input {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border: 2px solid #eee;
        border-radius: 12px;
        background: #f9f9f9;
        transition: 0.3s;
        outline: none;
      }

      .login-box input:focus {
        border-color: #764ba2;
        background: #fff;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: var(--primary-gradient);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
      }

      /* --- App Container --- */
      .app-container {
        width: 100%;
        max-width: 500px;
        height: 90vh;
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        animation: slideUp 0.6s ease;
      }

      /* Header */
      .header {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--glass-border);
        color: white;
      }

      .header h4 {
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .exit-btn {
        background: rgba(255, 0, 0, 0.2);
        border: 1px solid rgba(255, 0, 0, 0.3);
        padding: 5px 15px;
        border-radius: 20px;
        color: white;
        cursor: pointer;
        font-size: 12px;
        transition: 0.3s;
      }
      .exit-btn:hover {
        background: rgba(255, 0, 0, 0.4);
      }

      /* Chat Window */
      .chat-window {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        scrollbar-width: thin;
      }

      /* Scrollbar Styling */
      .chat-window::-webkit-scrollbar {
        width: 6px;
      }
      .chat-window::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }

      /* Messages */
      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        position: relative;
        word-wrap: break-word;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        animation: fadeIn 0.4s ease forwards;
        line-height: 1.5;
      }

      .sent {
        align-self: flex-end;
        background: var(--my-msg-bg);
        color: white;
        border-bottom-right-radius: 4px;
      }

      .received {
        align-self: flex-start;
        background: var(--other-msg-bg);
        color: #444;
        border-bottom-left-radius: 4px;
      }

      .sender-name {
        font-size: 10px;
        font-weight: bold;
        display: block;
        margin-bottom: 4px;
        opacity: 0.8;
      }

      .media-content {
        max-width: 100%;
        border-radius: 10px;
        margin-top: 5px;
        display: block;
      }

      /* Input Area */
      .input-area {
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .input-box {
        flex: 1;
        padding: 14px;
        border-radius: 30px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
      }

      /* File Button */
      .icon-btn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        transition: 0.3s;
      }
      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.1);
      }

      .send-btn {
        background: var(--primary-gradient);
        color: white;
      }

      #file-loading {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="login-screen">
      <div class="login-box">
        <h2>✨ Premium Chat</h2>
        <p style="color: #666; margin-bottom: 20px; font-size: 14px">
          Secure & Fast Global Messaging
        </p>
        <input type="text" id="username" placeholder="Choose a Username" />
        <input type="password" id="passkey" placeholder="Enter Room Key" />
        <button class="btn" id="joinBtn">Enter Room</button>
      </div>
    </div>

    <div class="app-container" id="app">
      <div class="header">
        <div>
          <h4 id="room-display">Room</h4>
          <small style="opacity: 0.7; font-size: 10px"
            >🟢 Online • Firebase Sync</small
          >
        </div>
        <button class="exit-btn" onclick="location.reload()">Exit</button>
      </div>

      <div class="chat-window" id="chatWindow"></div>

      <div id="file-loading">Compressing & Uploading...</div>

      <div class="input-area">
        <input type="file" id="fileInput" accept="image/*,video/*" hidden />

        <button
          class="icon-btn"
          onclick="document.getElementById('fileInput').click()"
        >
          📎
        </button>

        <input
          type="text"
          class="input-box"
          id="messageInput"
          placeholder="Type something..."
        />

        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import {
        getDatabase,
        ref,
        push,
        onChildAdded,
      } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBWbW8qTx06fZcXzY1kUeLhWp3t-qyGGkg",
        authDomain: "mychatapp-7414e.firebaseapp.com",
        databaseURL: "https://mychatapp-7414e-default-rtdb.firebaseio.com",
        projectId: "mychatapp-7414e",
        storageBucket: "mychatapp-7414e.firebasestorage.app",
        messagingSenderId: "890468132684",
        appId: "1:890468132684:web:769364e9b89a219f53d1e9",
        measurementId: "G-RW4W75PWM6",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      let myName = "";
      let myPasskey = "";
      let chatRef;

      // UI References
      const loginScreen = document.getElementById("login-screen");
      const appDiv = document.getElementById("app");
      const chatWindow = document.getElementById("chatWindow");
      const msgInput = document.getElementById("messageInput");
      const fileInput = document.getElementById("fileInput");
      const loader = document.getElementById("file-loading");

      // --- JOIN ROOM ---
      document.getElementById("joinBtn").addEventListener("click", () => {
        const nameIn = document.getElementById("username").value.trim();
        const passIn = document.getElementById("passkey").value.trim();

        if (!nameIn || !passIn) return alert("Please fill in all fields.");

        myName = nameIn;
        myPasskey = passIn;

        loginScreen.style.display = "none";
        appDiv.style.display = "flex";
        document.getElementById(
          "room-display"
        ).innerText = `Room: ${myPasskey}`;

        chatRef = ref(db, "chats/" + myPasskey);

        onChildAdded(chatRef, (snapshot) => {
          const data = snapshot.val();
          displayMessage(data);
        });
      });

      // --- SEND TEXT MESSAGE ---
      document.getElementById("sendBtn").addEventListener("click", sendMessage);
      msgInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        push(chatRef, {
          user: myName,
          text: text,
          type: "text",
          timestamp: Date.now(),
        });
        msgInput.value = "";
      }

      // --- SEND FILE (IMAGE/VIDEO) ---
      fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        // Limit size to 2MB to prevent crash (Database limitation)
        if (file.size > 2 * 1024 * 1024) {
          alert("File is too large! Please select a file under 2MB.");
          this.value = "";
          return;
        }

        loader.style.display = "block"; // Show loading

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
          const base64Data = reader.result;
          const fileType = file.type.startsWith("image") ? "image" : "video";

          push(chatRef, {
            user: myName,
            fileData: base64Data,
            type: fileType,
            timestamp: Date.now(),
          }).then(() => {
            loader.style.display = "none"; // Hide loading
            fileInput.value = ""; // Reset input
          });
        };
      });

      // --- DISPLAY MESSAGE ---
      function displayMessage(data) {
        const div = document.createElement("div");
        const isMe = data.user === myName;

        div.className = `message ${isMe ? "sent" : "received"}`;

        let contentHtml = "";

        if (data.type === "text") {
          contentHtml = `<span>${data.text}</span>`;
        } else if (data.type === "image") {
          contentHtml = `<img src="${data.fileData}" class="media-content" alt="Image">`;
        } else if (data.type === "video") {
          contentHtml = `<video src="${data.fileData}" class="media-content" controls></video>`;
        }

        div.innerHTML = `
            <span class="sender-name">${isMe ? "You" : data.user}</span>
            ${contentHtml}
        `;

        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    </script>
  </body>
</html>
