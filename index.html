<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Premium Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      /* --- CSS STYLES --- */
      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --glass-bg: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.2);
        --my-msg-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --other-msg-bg: #ffffff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
      body {
        background: #1a1a2e;
        background-image: radial-gradient(circle at 10% 20%, rgb(90, 92, 106) 0%, rgb(32, 45, 58) 81.3%);
        height: 100vh;
        display: flex; justify-content: center; align-items: center; overflow: hidden;
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* Login Screen */
      #login-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
        z-index: 100; display: flex; justify-content: center; align-items: center;
      }
      .login-box {
        background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
        width: 90%; max-width: 380px; text-align: center;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        animation: fadeIn 0.5s ease;
      }
      .login-box h2 { color: #333; margin-bottom: 5px; }
      .login-box p { color: #666; font-size: 13px; margin-bottom: 20px; }
      
      .input-group { text-align: left; margin-bottom: 15px; }
      .input-group label { font-size: 12px; font-weight: bold; color: #555; margin-left: 5px; }
      .login-box input {
        width: 100%; padding: 14px; margin-top: 5px; border: 2px solid #ddd;
        border-radius: 12px; background: #f9f9f9; outline: none; transition: 0.3s;
      }
      .login-box input:focus { border-color: #764ba2; background: white; }
      
      .btn {
        width: 100%; padding: 14px; background: var(--primary-gradient);
        color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;
        margin-top: 10px;
      }

      /* Chat App */
      .app-container {
        width: 100%; max-width: 500px; height: 90vh; background: var(--glass-bg);
        backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
        border-radius: 24px; display: none; flex-direction: column;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      .header {
        background: rgba(255, 255, 255, 0.1); padding: 15px 20px;
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--glass-border); color: white;
      }
      .header-controls { display: flex; gap: 10px; }
      .small-btn {
        background: rgba(0, 0, 0, 0.3); border: none; padding: 6px 12px;
        border-radius: 20px; color: white; cursor: pointer; font-size: 11px;
      }
      .notify-active { background: #00c853 !important; }

      /* Chat Area */
      .chat-window {
        flex: 1; overflow-y: auto; padding: 20px; display: flex;
        flex-direction: column; gap: 15px; scrollbar-width: thin;
      }
      .message {
        max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px;
        position: relative; word-wrap: break-word; animation: fadeIn 0.4s ease forwards;
      }
      .sent { align-self: flex-end; background: var(--my-msg-bg); color: white; border-bottom-right-radius: 4px; }
      .received { align-self: flex-start; background: var(--other-msg-bg); color: #444; border-bottom-left-radius: 4px; }
      .sender-name { font-size: 10px; font-weight: bold; display: block; margin-bottom: 4px; opacity: 0.8; }
      .media-content { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; }

      /* Input Area */
      .input-area {
        padding: 15px; background: rgba(0, 0, 0, 0.2); display: flex; align-items: center; gap: 10px;
      }
      .input-box {
        flex: 1; padding: 14px; border-radius: 30px; border: none; outline: none; background: rgba(255, 255, 255, 0.9);
      }
      .icon-btn {
        background: rgba(255, 255, 255, 0.15); color: white; border: none; width: 45px; height: 45px;
        border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px;
      }
      .send-btn { background: var(--primary-gradient); }
      
      #file-loading {
        position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px;
        font-size: 12px; display: none; z-index: 50;
      }
    </style>
  </head>
  <body>

    <audio id="notifySound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

    <div id="login-screen">
      <div class="login-box">
        <h2>🚀 Global Chat</h2>
        <p>Secure & Fast Messaging</p>
        
        <div class="input-group">
          <label>YOUR NAME</label>
          <input type="text" id="username" placeholder="e.g. Rahul" />
        </div>

        <div class="input-group">
          <label>ROOM CODE (Optional)</label>
          <input type="text" id="roomCode" placeholder="Leave empty for Room 123" />
        </div>
        
        <button class="btn" id="joinBtn">Join Chat</button>
      </div>
    </div>

    <div class="app-container" id="app">
      <div class="header">
        <div>
          <h4 id="room-display">Room 123</h4>
          <small style="opacity: 0.7; font-size: 10px;">🟢 Connected</small>
        </div>
        <div class="header-controls">
          <button class="small-btn" id="notifyBtn" onclick="enableNotifications()">🔔 Enable Alerts</button>
          <button class="small-btn" onclick="location.reload()" style="background:rgba(255,0,0,0.4)">Logout</button>
        </div>
      </div>

      <div class="chat-window" id="chatWindow"></div>
      
      <div id="file-loading">Uploading large file... Please wait.</div>

      <div class="input-area">
        <input type="file" id="fileInput" accept="image/*,video/*" hidden>
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" class="input-box" id="messageInput" placeholder="Type a message..." />
        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBWbW8qTx06fZcXzY1kUeLhWp3t-qyGGkg",
        authDomain: "mychatapp-7414e.firebaseapp.com",
        databaseURL: "https://mychatapp-7414e-default-rtdb.firebaseio.com",
        projectId: "mychatapp-7414e",
        storageBucket: "mychatapp-7414e.firebasestorage.app",
        messagingSenderId: "890468132684",
        appId: "1:890468132684:web:769364e9b89a219f53d1e9",
        measurementId: "G-RW4W75PWM6",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // Variables
      let myName = localStorage.getItem("chatUser") || "";
      let currentRoom = "123";
      let chatRef;

      // UI
      const loginScreen = document.getElementById("login-screen");
      const appDiv = document.getElementById("app");
      const chatWindow = document.getElementById("chatWindow");
      const msgInput = document.getElementById("messageInput");
      const fileInput = document.getElementById("fileInput");
      const loader = document.getElementById("file-loading");
      const notifySound = document.getElementById("notifySound");

      // Auto-fill name if exists
      if(myName) document.getElementById("username").value = myName;

      // --- JOIN BUTTON LOGIC ---
      document.getElementById("joinBtn").addEventListener("click", () => {
        const nameIn = document.getElementById("username").value.trim();
        const roomIn = document.getElementById("roomCode").value.trim();

        if (!nameIn) return alert("Name is required!");

        myName = nameIn;
        localStorage.setItem("chatUser", myName);

        // Logic: Empty input = Room 123, otherwise Custom Room
        currentRoom = roomIn ? roomIn : "123";

        startChat();
      });

      function startChat() {
        loginScreen.style.display = "none";
        appDiv.style.display = "flex";
        document.getElementById("room-display").innerText = `Room: ${currentRoom}`;

        chatRef = ref(db, "chats/" + currentRoom);

        // Load Messages
        onChildAdded(chatRef, (snapshot) => {
          const data = snapshot.val();
          displayMessage(data);
          handleNotification(data);
        });
      }

      // --- NOTIFICATION & SOUND LOGIC ---
      // This needs to be global so button can call it
      window.enableNotifications = function() {
        // 1. Ask Browser Permission
        Notification.requestPermission().then(perm => {
          if (perm === "granted") {
            const btn = document.getElementById("notifyBtn");
            btn.innerText = "🔔 Alerts ON";
            btn.classList.add("notify-active");
            
            // 2. Play silent sound to UNLOCK Audio Context
            notifySound.play().catch(e => console.log("Audio started"));
          } else {
            alert("Please allow notifications in your browser settings.");
          }
        });
      };

      function handleNotification(data) {
        if (data.user !== myName) {
            // Play Sound
            try {
                notifySound.currentTime = 0;
                notifySound.play().catch(e => console.error("User interaction needed first"));
            } catch(e) {}

            // Show Popup
            if (document.hidden && Notification.permission === "granted") {
                new Notification(`New msg in Room ${currentRoom}`, {
                    body: `${data.user}: ${data.type === 'text' ? data.text : 'Sent a file'}`,
                    icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png"
                });
            }
        }
      }

      // --- SEND MESSAGE ---
      document.getElementById("sendBtn").addEventListener("click", sendMessage);
      msgInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        push(chatRef, {
          user: myName,
          text: text,
          type: 'text',
          timestamp: Date.now(),
        });
        msgInput.value = "";
      }

      // --- FILE UPLOAD (Max ~7-8MB Source File) ---
      fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        // Check Size: 8MB limit (Base64 increases size by 30%, keeping it safe under Firebase 10MB limit)
        if (file.size > 8 * 1024 * 1024) {
          alert("File too large! Please upload files smaller than 8MB.");
          this.value = "";
          return;
        }

        loader.style.display = "block"; 

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
          const base64Data = reader.result;
          const fileType = file.type.startsWith("image") ? "image" : "video";

          push(chatRef, {
            user: myName,
            fileData: base64Data,
            type: fileType,
            timestamp: Date.now(),
          })
          .then(() => {
            loader.style.display = "none"; 
            fileInput.value = ""; 
          })
          .catch(err => {
            loader.style.display = "none";
            console.error(err);
            alert("Upload Failed: File might be too complex for the free database.");
          });
        };
      });

      // --- DISPLAY UI ---
      function displayMessage(data) {
        const div = document.createElement("div");
        const isMe = data.user === myName;

        div.className = `message ${isMe ? "sent" : "received"}`;
        
        let contentHtml = "";
        if (data.type === 'text') {
           contentHtml = `<span>${data.text}</span>`;
        } else if (data.type === 'image') {
           contentHtml = `<img src="${data.fileData}" class="media-content" alt="Image">`;
        } else if (data.type === 'video') {
           contentHtml = `<video src="${data.fileData}" class="media-content" controls></video>`;
        }

        div.innerHTML = `
            <span class="sender-name">${isMe ? "You" : data.user}</span>
            ${contentHtml}
        `;

        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    </script>
  </body>
</html>
