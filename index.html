<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Chat (Room 123)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      /* --- PREMIUM CSS (Same as before) --- */
      :root {
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --glass-bg: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.2);
        --my-msg-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --other-msg-bg: #ffffff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
      body {
        background: #1a1a2e;
        background-image: radial-gradient(circle at 10% 20%, rgb(90, 92, 106) 0%, rgb(32, 45, 58) 81.3%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      /* Login Screen */
      #login-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
        z-index: 100; display: flex; justify-content: center; align-items: center;
      }
      .login-box {
        background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
        width: 90%; max-width: 350px; text-align: center;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }
      .login-box input {
        width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #eee;
        border-radius: 12px; background: #f9f9f9; outline: none;
      }
      .btn {
        width: 100%; padding: 15px; background: var(--primary-gradient);
        color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;
      }

      /* App Container */
      .app-container {
        width: 100%; max-width: 500px; height: 90vh; background: var(--glass-bg);
        backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
        border-radius: 24px; display: none; flex-direction: column;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      .header {
        background: rgba(255, 255, 255, 0.1); padding: 20px;
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--glass-border); color: white;
      }
      .logout-btn {
        background: rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.3);
        padding: 5px 15px; border-radius: 20px; color: white; cursor: pointer; font-size: 12px;
      }

      /* Chat Window */
      .chat-window {
        flex: 1; overflow-y: auto; padding: 20px; display: flex;
        flex-direction: column; gap: 15px; scrollbar-width: thin;
      }
      .message {
        max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px;
        position: relative; word-wrap: break-word; animation: fadeIn 0.4s ease forwards;
      }
      .sent { align-self: flex-end; background: var(--my-msg-bg); color: white; border-bottom-right-radius: 4px; }
      .received { align-self: flex-start; background: var(--other-msg-bg); color: #444; border-bottom-left-radius: 4px; }
      .sender-name { font-size: 10px; font-weight: bold; display: block; margin-bottom: 4px; opacity: 0.8; }
      .media-content { max-width: 100%; border-radius: 10px; margin-top: 5px; }

      /* Input */
      .input-area {
        padding: 15px; background: rgba(0, 0, 0, 0.2); display: flex; align-items: center; gap: 10px;
      }
      .input-box {
        flex: 1; padding: 14px; border-radius: 30px; border: none; outline: none; background: rgba(255, 255, 255, 0.9);
      }
      .icon-btn {
        background: rgba(255, 255, 255, 0.15); color: white; border: none; width: 45px; height: 45px;
        border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px;
      }
      .send-btn { background: var(--primary-gradient); }
      
      #file-loading {
        position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px;
        font-size: 12px; display: none; z-index: 50;
      }
    </style>
  </head>
  <body>

    <audio id="notifySound" src="data:audio/mp3;base64,//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq" preload="auto"></audio>

    <div id="login-screen">
      <div class="login-box">
        <h2>🔒 Secure Chat</h2>
        <p style="color:#666; margin-bottom:10px;">Room: <b>123 (Fixed)</b></p>
        <input type="text" id="username" placeholder="Enter Your Name" />
        <button class="btn" id="joinBtn">Start Chatting</button>
      </div>
    </div>

    <div class="app-container" id="app">
      <div class="header">
        <div>
          <h4>Room 123</h4>
          <small style="opacity: 0.7; font-size: 10px;">🔔 Notifications ON</small>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>

      <div class="chat-window" id="chatWindow"></div>
      
      <div id="file-loading">Uploading large file (Wait)...</div>

      <div class="input-area">
        <input type="file" id="fileInput" accept="image/*,video/*" hidden>
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" class="input-box" id="messageInput" placeholder="Type a message..." />
        <button class="icon-btn send-btn" id="sendBtn">➤</button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBWbW8qTx06fZcXzY1kUeLhWp3t-qyGGkg",
        authDomain: "mychatapp-7414e.firebaseapp.com",
        databaseURL: "https://mychatapp-7414e-default-rtdb.firebaseio.com",
        projectId: "mychatapp-7414e",
        storageBucket: "mychatapp-7414e.firebasestorage.app",
        messagingSenderId: "890468132684",
        appId: "1:890468132684:web:769364e9b89a219f53d1e9",
        measurementId: "G-RW4W75PWM6",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // --- FIXED ROOM CONFIG ---
      const ROOM_ID = "123"; 
      let myName = localStorage.getItem("chatUser") || ""; // Auto-load name
      let chatRef = ref(db, "chats/" + ROOM_ID);

      // DOM Elements
      const loginScreen = document.getElementById("login-screen");
      const appDiv = document.getElementById("app");
      const chatWindow = document.getElementById("chatWindow");
      const msgInput = document.getElementById("messageInput");
      const fileInput = document.getElementById("fileInput");
      const loader = document.getElementById("file-loading");
      const notifySound = document.getElementById("notifySound");

      // --- AUTO LOGIN CHECK ---
      if (myName) {
        initChat();
      } else {
        loginScreen.style.display = "flex";
      }

      // --- LOGIN BUTTON ---
      document.getElementById("joinBtn").addEventListener("click", () => {
        const nameIn = document.getElementById("username").value.trim();
        if (!nameIn) return alert("Name is required");

        myName = nameIn;
        localStorage.setItem("chatUser", myName); // Save for next time
        initChat();
      });

      // --- LOGOUT BUTTON ---
      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("chatUser");
        location.reload();
      });

      // --- INITIALIZE CHAT ---
      function initChat() {
        loginScreen.style.display = "none";
        appDiv.style.display = "flex";
        
        // Request Notification Permission
        if (Notification.permission !== "granted") {
          Notification.requestPermission();
        }

        // Listen for messages
        onChildAdded(chatRef, (snapshot) => {
          const data = snapshot.val();
          displayMessage(data);
          handleNotification(data);
        });
      }

      // --- HANDLE NOTIFICATIONS ---
      function handleNotification(data) {
        // Only notify if message is NOT from me
        if (data.user !== myName) {
            // 1. Play Sound
            notifySound.currentTime = 0;
            notifySound.play().catch(e => console.log("Audio play blocked until interaction"));

            // 2. Browser Notification (if tab is hidden/background)
            if (document.hidden && Notification.permission === "granted") {
                new Notification(`New message from ${data.user}`, {
                    body: data.type === 'text' ? data.text : "Sent a file",
                    icon: "https://cdn-icons-png.flaticon.com/512/1041/1041916.png"
                });
            }
        }
      }

      // --- SEND MESSAGE ---
      document.getElementById("sendBtn").addEventListener("click", sendMessage);
      msgInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;

        push(chatRef, {
          user: myName,
          text: text,
          type: 'text',
          timestamp: Date.now(),
        });
        msgInput.value = "";
      }

      // --- SEND FILE (10MB LIMIT) ---
      fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        // 10MB Limit (10 * 1024 * 1024)
        if (file.size > 10 * 1024 * 1024) {
          alert("File too big! Max limit is 10MB.");
          this.value = "";
          return;
        }

        loader.style.display = "block"; 

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
          const base64Data = reader.result;
          const fileType = file.type.startsWith("image") ? "image" : "video";

          push(chatRef, {
            user: myName,
            fileData: base64Data,
            type: fileType,
            timestamp: Date.now(),
          })
          .then(() => {
            loader.style.display = "none"; 
            fileInput.value = ""; 
          })
          .catch(err => {
            loader.style.display = "none";
            alert("Upload failed. Internet might be too slow for this file.");
          });
        };
      });

      // --- DISPLAY MESSAGE ---
      function displayMessage(data) {
        const div = document.createElement("div");
        const isMe = data.user === myName;

        div.className = `message ${isMe ? "sent" : "received"}`;
        
        let contentHtml = "";
        if (data.type === 'text') {
           contentHtml = `<span>${data.text}</span>`;
        } else if (data.type === 'image') {
           contentHtml = `<img src="${data.fileData}" class="media-content" alt="Image">`;
        } else if (data.type === 'video') {
           contentHtml = `<video src="${data.fileData}" class="media-content" controls></video>`;
        }

        div.innerHTML = `
            <span class="sender-name">${isMe ? "You" : data.user}</span>
            ${contentHtml}
        `;

        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
    </script>
  </body>
</html>
